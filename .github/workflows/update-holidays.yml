name: Refresh official holiday data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-holiday-data
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.HOLIDAY_COLLECTION_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 6
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and validate official holidays
        env:
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
        run: python scripts/collect_holidays.py
      - name: Save validated data and source check time
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/holidays.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh official holiday data'
          git push origin HEAD:main
