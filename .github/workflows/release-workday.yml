name: Release Workday
on:
  push:
    branches: [main]
    paths: ['workday/**', '.github/workflows/release-workday.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: workday-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read version and check existing release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $text=Get-Content -LiteralPath workday/src/AppUpdates.cs -Raw -Encoding UTF8
          $version=[regex]::Match($text,'DisplayVersion = "([0-9.]+)"').Groups[1].Value
          if(-not $version){throw 'Missing version'}
          $tag='workday-v'+$version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if($LASTEXITCODE -eq 0){'exists=true' >> $env:GITHUB_OUTPUT}else{'exists=false' >> $env:GITHUB_OUTPUT}
          exit 0
      - name: Build and verify
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        run: ./workday/package.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE/workday-artifacts"
      - name: Publish, verify download and update feed
        if: steps.version.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $ErrorActionPreference='Stop'
          $assets=@(Get-ChildItem -LiteralPath workday-artifacts -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "320일 근무 편성기 $env:RELEASE_VERSION" --notes-file workday/RELEASE-NOTES.md --latest=false
          if($LASTEXITCODE -ne 0){throw 'Release failed'}
          $exe='Workday-'+$env:RELEASE_VERSION+'.exe'
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $exe --dir workday-download-check
          if($LASTEXITCODE -ne 0){throw 'Download check failed'}
          $manifest=Get-Content -LiteralPath workday-artifacts/latest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $hash=(Get-FileHash -LiteralPath (Join-Path workday-download-check $exe) -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne $manifest.sha256){throw 'Published EXE hash mismatch'}
          Copy-Item -LiteralPath workday-artifacts/latest.json -Destination workday/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- workday/latest.json
          git commit -m "Publish Workday $env:RELEASE_VERSION update feed"
          if($LASTEXITCODE -ne 0){throw 'Feed commit failed'}
          git pull --rebase origin main
          if($LASTEXITCODE -ne 0){throw 'Feed rebase failed'}
          git push origin HEAD:main
          if($LASTEXITCODE -ne 0){throw 'Feed push failed'}
